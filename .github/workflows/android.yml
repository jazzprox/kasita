# Builds the signed Kasita Android app and publishes it as a GitHub release.
# Needs repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD.
name: Android app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml", "scripts/release-notes.sh"]
  workflow_dispatch:

permissions:
  contents: write   # to create the release

jobs:
  # Until the signing secrets exist, skip the build (grey "skipped") instead
  # of failing and emailing on every push.
  check:
    runs-on: ubuntu-latest
    outputs:
      has_keys: ${{ steps.keys.outputs.has_keys }}
    steps:
      - id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "has_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::KEYSTORE_BASE64 / KEYSTORE_PASSWORD not set yet, skipping the APK build"
            echo "has_keys=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.has_keys == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history + tags for the release notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/kasita-release.jks
          printf 'storeFile=kasita-release.jks\nstorePassword=%s\nkeyAlias=kasita\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      - run: flutter pub get
      - run: flutter analyze

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          # zero-padded so the releases page (which sorts tags as text) lists 0012 above 0009
          TAG=$(printf 'android-%04d' "$N")
          ../scripts/release-notes.sh > notes.md
          cp build/app/outputs/flutter-apk/app-release.apk "kasita-$N.apk"
          gh release create "$TAG" "kasita-$N.apk" --title "Kasita build $N" --notes-file notes.md --latest

      # One-time tidy, idempotent: older releases had unpadded tags (android-9) that sorted
      # above newer ones, and no notes. Move each to a padded tag and write its notes.
      - name: Tidy older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for old in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^android-[0-9]{1,3}$' || true); do
            n=${old#android-}
            new=$(printf 'android-%04d' "$n")
            ../scripts/release-notes.sh "" "$old" > old-notes.md
            git push -q origin "$(git rev-list -n1 "$old"):refs/tags/$new"
            gh release edit "$old" --tag "$new" --title "Kasita build $n" --notes-file old-notes.md
            git push -q origin ":refs/tags/$old"
            echo "moved $old -> $new"
          done
