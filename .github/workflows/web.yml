# Builds the Kasita web app and publishes it to the `web-dist` branch.
# The home server is too tight on memory for dart2js, so it only pulls this
# branch (with its deploy key) and copies it into server/web: see
# scripts/deploy-web.sh. No secrets needed.
name: Web app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to push the web-dist branch

concurrency:
  group: web-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          # no service worker: it kept serving old builds (the generated
          # flutter_service_worker.js then just unregisters existing ones)
          flutter build web --release --pwa-strategy=none

      # Flutter's file names are not content-hashed and Cloudflare forces a
      # 4-hour browser cache on .js, so a deploy did not reach open browsers.
      # Give the two entry scripts per-build names; index.html is never cached.
      - name: Fingerprint entry scripts
        working-directory: app/build/web
        run: |
          v="${GITHUB_SHA::8}"
          test "$(grep -c '"main.dart.js"' flutter_bootstrap.js)" -ge 1
          sed -i "s/\"main\.dart\.js\"/\"main.${v}.dart.js\"/g" flutter_bootstrap.js
          mv main.dart.js "main.${v}.dart.js"
          mv flutter_bootstrap.js "flutter_bootstrap.${v}.js"
          sed -i "s/src=\"flutter_bootstrap\.js\"/src=\"flutter_bootstrap.${v}.js\"/" index.html
          grep -q "flutter_bootstrap.${v}.js" index.html
          ls

      - name: Publish to web-dist
        run: |
          cd app/build/web
          echo "${GITHUB_SHA}" > BUILD_COMMIT
          git init -q -b web-dist
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Web build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-dist
